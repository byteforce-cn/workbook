name: Release

# Manual dispatch for now — push-triggered releases can be enabled
# once the first release has been verified.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: changesets release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          # v2 renamed the v1 `version`/`publish` inputs (unknown inputs are
          # ignored), and now pushes release commits, tags and GitHub Releases
          # via the GitHub API by default.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm changeset version
          publish-script: pnpm changeset publish
        env:
          NPM_CONFIG_PROVENANCE: "true"
