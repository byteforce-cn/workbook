name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck-and-unit:
    name: typecheck + unit (node ${{ matrix.node }}, react ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20
            react: "19"
          - node: 22
            react: "19"
          - node: 20
            react: "18"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Switch to React 18
        if: matrix.react == '18'
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));Object.assign(p.devDependencies,{'react':'^18.3.1','react-dom':'^18.3.1','@types/react':'^18.3.12','@types/react-dom':'^18.3.1'});fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
          pnpm install --no-frozen-lockfile
      - run: pnpm generate:types
      - run: git diff --exit-code -- src/schema/generated-types.ts
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: Coverage thresholds (node 20 / react 19 only)
        if: matrix.node == 20 && matrix.react == '19'
        run: pnpm test:coverage

  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:conformance

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  builds:
    name: builds (lib + storybook + docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: API surface report check
        run: pnpm api:check
      - run: pnpm build-storybook
      - run: pnpm docs:api && pnpm docs:build
